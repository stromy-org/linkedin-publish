[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-publish"
version = "0.1.0"
description = "Official LinkedIn publishing client and durable, approval-gated publication service"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "William Masquelier", email = "william.masquelier@stromy.com.au" }]
dependencies = [
    "click>=8.0",
    # Add your runtime dependencies here.
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
all = ["linkedin-publish[postgres]"]

# PEP 735 dependency-groups — installed by default with `uv sync` (no --extra needed).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
]


[project.scripts]
linkedin-publish = "linkedin_publish.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_publish"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "B", "PERF", "S", "E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# S101 assert: pytest's assertion mechanism.
# S105/S106 hardcoded credential: every "token" and "secret" in the suite is a
#   literal placeholder — the tests exist precisely to prove no real credential
#   is ever needed, so flagging them inverts the signal.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/linkedin_publish"]
# Click is partially typed — relax for the CLI entry point only.
exclude = ["src/linkedin_publish/cli.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Fast, isolated unit tests",
    "contract: Public API contract stability tests",
    "integration: End-to-end tests",
    # Add `requires_<dep>` markers as you add optional-dependency-gated tests.
]
