# Self-contained on purpose — do NOT convert this into a call to
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# The template ships that call, and every PRIVATE Python satellite uses it. This
# repo is PUBLIC and the control plane hosting the shared workflow is PRIVATE, so
# the call does not resolve: the run fails at 0s with a startup error, zero jobs,
# and GitHub reports only "this run likely failed because of a workflow file
# issue". That is exactly what happened on this repo's first push (run
# 34720884095) — and `asset-transport` carries the same comment, having hit it
# when it went public.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy — and this repo is public precisely so consumers can resolve its tagged
# source without build credentials.
#
# The cost is real and accepted: keep this in step with ci-python.yml by hand.
# Keep it minimal so that stays cheap — this repo has no private git+URL
# dependencies, so the App-token minting that workflow spends a job on has
# nothing to do here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

