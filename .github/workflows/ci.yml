# Self-contained on purpose — do NOT convert this into a call to
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# The template ships that call, and every PRIVATE Python satellite uses it. This
# repo is PUBLIC and the control plane hosting the shared workflow is PRIVATE, so
# the call does not resolve: the run fails at 0s with a startup error, zero jobs,
# and GitHub reports only "this run likely failed because of a workflow file
# issue". That is exactly what happened on this repo's first push (run
# 34720884095) — and `asset-transport` carries the same comment, having hit it
# when it went public.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy — and this repo is public precisely so consumers can resolve its tagged
# source without build credentials.
#
# The cost is real and accepted: keep this in step with ci-python.yml by hand.
# Keep it minimal so that stays cheap — this repo has no private git+URL
# dependencies, so the App-token minting that workflow spends a job on has
# nothing to do here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# The shared adapter inherits ci-python's caller-scoped group; the generated
# one runs its checks inline, so it cancels superseded PR runs itself and
# never cancels a default-branch run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  python-ci:
    if: ${{ !github.event.repository.private || vars.CI_MODE_SATELLITE != 'off' }}
    runs-on: ${{ fromJSON((github.event.repository.private && (((github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') && vars.CI_RUNS_ON_SATELLITE_MAIN) || (github.event_name == 'pull_request' && vars.CI_RUNS_ON_SATELLITE_PR) || vars.CI_RUNS_ON_SATELLITE)) || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
    # The same Linux context runs every existing check, including the real
    # durable tier. The finite CI deviation records this repository-owned DSN.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.26'
          cache-dependency-glob: uv.lock
          enable-cache: ${{ !contains(fromJSON((github.event.repository.private && (((github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') && vars.CI_RUNS_ON_SATELLITE_MAIN) || (github.event_name == 'pull_request' && vars.CI_RUNS_ON_SATELLITE_PR) || vars.CI_RUNS_ON_SATELLITE)) || '"ubuntu-latest"'), 'self-hosted') }}
      - run: uv python install 3.12
      - name: Install
        timeout-minutes: 10
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/linkedin_publish
      - name: Unit tests
        run: |
          rm -f .unit-junit.xml
          uv run pytest tests/unit --junitxml=.unit-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite unit --report .unit-junit.xml --returncode 0
      - name: Contract tests
        run: |
          rm -f .contract-junit.xml
          uv run pytest tests/contract --junitxml=.contract-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step contract --suite contract --report .contract-junit.xml --returncode 0
      - name: Integration tests
        env:
          LINKEDIN_PUBLISH_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres
        # Real multiprocess CAS, rollback and column-level grants stay required.
        # Missing DSNs fail in CI and zero/skipped reports fail the owner floor.
        run: |
          rm -f .pytest_cache/postgres-junit.xml
          uv run pytest tests/integration -v --junitxml=.pytest_cache/postgres-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite postgres --report .pytest_cache/postgres-junit.xml --returncode 0
      - run: uv lock --check
      - run: uv build
