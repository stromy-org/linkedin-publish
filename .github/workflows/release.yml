# Build a sdist+wheel on tag push and attach them to a GitHub Release.
#
# Workflow:
#   1. Bump version in pyproject.toml on main.
#   2. git tag vX.Y.Z && git push --tags
#   3. This workflow builds + publishes the release.
#
# Consumers depend on a specific tag via:
#   "<pkg> @ git+https://github.com/stromy-org/linkedin-publish.git@vX.Y.Z"
# so the GitHub Release artifacts are informational — uv reads the source tree
# at the tagged commit directly. The release page is the human-facing audit
# trail and changelog anchor.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PYPROJECT_VERSION}"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

      # NO auto-bump dispatch here, deliberately (ORG-296, 2026-09-13).
      #
      # This step used to fire `repository_dispatch` at a hand-written list of
      # consumer repos. `POST /dispatches` returns 204 whether or not anything
      # listens, so the list could rot in silence — and it had: the receiver
      # existed in one repo, five named targets had none, and eight real
      # consumers were named by no sender at all.
      #
      # Pins are now reconciled centrally by stromy-org's
      # .github/workflows/internal-lib-pins.yml, which DERIVES the consumer
      # graph from every repo's own [tool.uv.sources] each run and opens the
      # bump PRs. Nothing here needs to know who consumes this library.
      #
      # Re-adding a fan-out is gated: `internal-lib-pins.py --check` fails on a
      # dispatch aimed at a repo with no receiver.
