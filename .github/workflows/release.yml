# Build a sdist+wheel on tag push and attach them to a GitHub Release.
#
# Workflow:
#   1. Bump version in pyproject.toml on main.
#   2. git tag vX.Y.Z && git push --tags
#   3. This workflow builds + publishes the release.
#
# Consumers depend on a specific tag via:
#   "<pkg> @ git+https://github.com/stromy-org/linkedin-publish.git@vX.Y.Z"
# so the GitHub Release artifacts are informational — uv reads the source tree
# at the tagged commit directly. The release page is the human-facing audit
# trail and changelog anchor.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A RELEASE MUST SHIP REVIEWED, CI-GATED CODE — and until 2026-09-13 this
  # template did not say so, while all six library satellites did. Every one of
  # media-gen, lead-scout, linkedin-data, report-renderer, asset-transport and
  # fetch-kit carries this guard; the template carried neither it nor the quality
  # job, so a `copier update` REMOVED both from whichever satellite adopted it.
  # Measured on a media-gen clone that day: the update deleted `guard` and
  # `quality` and left `build-and-release` with no `needs:` at all — a release
  # gate silently traded away for a template sync. Backported here so the
  # template is no longer the one repo in its own fleet without it.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry test needs real history; a shallow clone makes
          # `merge-base --is-ancestor` answer about a graph it cannot see.
          fetch-depth: 0
      - name: Refuse a tag that is not reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main."
            echo "::error::Merge the work to main before tagging — a release must ship reviewed, CI-gated code."
            exit 1
          fi

  quality:
    needs: guard
    uses: stromy-org/stromy-org/.github/workflows/ci-python.yml@main
    with:
      source_package: "src/linkedin_publish"
    secrets: inherit

  build-and-release:
    needs: [guard, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PYPROJECT_VERSION}"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

